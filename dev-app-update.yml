provider: generic
# 仅开发模式（autoUpdater.forceDevUpdateConfig = true）生效；正式包的更新地址由运行时
# setFeedURL（取 .env 的 VITE_APP_DOWNLOAD）决定，electron-builder.json5 的 publish.url 与之保持一致。
url: https://bd.sshine.ltd/
# 与 electron-builder.json5 的 productName 对齐（原值 annotation-admin-pc-updater 与
# productName annotation-admin-pc-two 不一致，缓存目录与安装路径会对不上）
updaterCacheDirName: annotation-admin-pc-two-updater
